services:
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    volumes:
      - appdata:/data
      - ./secrets:/secrets:ro   # YouTube/Vimeo upload credentials (not in git)

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-ws.birbilling.live}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - appdata:/appdata:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  appdata:
  caddy_data:
  caddy_config:
